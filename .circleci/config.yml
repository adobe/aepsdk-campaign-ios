# Use the latest 2.1 version of CircleCI pipeline process engine. 
# See: https://circleci.com/docs/2.0/configuration-reference

version: 2.1

orbs:
  # codecov: codecov/codecov@3.3.0
  macos: circleci/macos@2

workflows:
  version: 2
  build-test:
    jobs:
      - validate-code
      - test-ios:
          requires:
            - validate-code
      - test-spm-podspec-archive:
          requires:
            - validate-code
      - build-swift6:
          requires:
            - validate-code
      - build-min-toolchain:
          requires:
            - validate-code

commands:
  install_dependencies:
    steps:
      # restore pods related caches
      - restore_cache:
          name: Restore Gemfile Cache
          keys:
            - 1-gems-{{ checksum "Gemfile.lock" }}

      # make sure we're on the right version of cocoapods
      - run:
          name: Verify Cocoapods Version
          command: |
            bundle config set --local path 'vendor/bundle'
            bundle check || bundle install

      # save cocoapods version gem data
      - save_cache:
          name: Save Gemfile Cache
          key: 1-gems-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      # install CocoaPods - using default CocoaPods version, not the bundle
      - run:
          name: Repo Update & Install CocoaPods
          command: make ci-pod-install

      - run:
          name: Install xcodegen
          command: brew install xcodegen


  prestart_ios_simulator:
    steps:
      - macos/preboot-simulator:
          platform: "iOS"
          version: "27.0"
          device: "iPhone 18 Pro"

jobs:
  validate-code:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0 # Specify the Xcode version to use

    steps:
      - checkout

      - install_dependencies

      - run:
          name: Install SwiftFormat
          command: make install-swiftformat

      - run:
          name: Lint Source Code
          command: make lint; make check-format


  test-ios:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0 # Specify the Xcode version to use

    steps:
      - checkout

      - install_dependencies

      - prestart_ios_simulator

      - run:
          name: Run AEPCampaign Tests
          command: make test

      # Code coverage upload using Codecov
      # See options explanation here: https://docs.codecov.com/docs/codecov-uploader
      # - codecov/upload:
      #     flags: aepcampaign-ios-tests
      #     upload_name: Coverage Report for AEPCampaign iOS Tests
      #     xtra_args: -c -v --xc --xp build/AEPCampaign.xcresult

  test-spm-podspec-archive:  
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0 # Specify the Xcode version to use
    
    steps:
      - checkout
      - install_dependencies
      
      # verify XCFramework archive builds
      - run:
          name: Build XCFramework
          command: |
            if [ "${CIRCLE_BRANCH}" == "main" ] || [ "${CIRCLE_BRANCH}" == "staging" ]; then
              make ci-archive
            fi
      # verify podspec is valid
      # - run:
      #     name: Test Podspec
      #     command: |
      #       if [ "${CIRCLE_BRANCH}" == "main" ]; then
      #         make test-podspec
      #       fi
      # verify SPM works
      - run:
          name: Test SPM 
          command: |
            if [ "${CIRCLE_BRANCH}" == "main" ] || [ "${CIRCLE_BRANCH}" == "staging" ]; then
              make test-SPM-integration
            fi

  # Swift 6 language mode coverage. Xcode 27 does not select Swift 6 because the checked in
  # targets stay on Swift 5, so this lane builds only the AEPCampaign target in Swift 6 through
  # AEPCAMPAIGN_SWIFT_VERSION and then compiles a Swift 6 consumer. Dependencies keep their modes.
  build-swift6:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0

    steps:
      - checkout
      - install_dependencies
      - run:
          name: Build AEPCampaign in Swift 6 language mode (dependencies keep their modes)
          command: make build-swift6
      - run:
          name: Build Swift 6 consumer (plain calls from @MainActor and SwiftUI)
          command: make test-swift6-consumer

  # Minimum supported toolchain coverage. README advertises Xcode 15.3 and Swift 5.10; 15.4 is
  # the oldest 15.x image CircleCI still hosts and ships the same Swift 5.10 compiler.
  build-min-toolchain:
    resource_class: m4pro.medium
    macos:
      xcode: 15.4.0

    steps:
      - checkout
      - install_dependencies
      - run:
          name: Build SDK on minimum supported toolchain (Xcode 15.4 / Swift 5.10)
          command: make build-min-toolchain
